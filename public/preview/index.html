<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>IA Schools — Demonstração</title>
<!--
  O redirecionamento foi removido em 17/08/2026, no dia do workshop.

  Motivo, medido no navegador: servido pelo túnel, o app não hidratava. Os 26
  pacotes chegavam com 200, mas nenhum handler era ligado e o login não respondia
  ao clique — é o servidor de DESENVOLVIMENTO do Next, que depende de um
  WebSocket que não sobrevive ao túnel. Mandar alguém para lá era entregar uma
  tela morta.

  Para reativar: subir a aplicação em modo de produção (next build + next start),
  com AUTH_SESSION_SECRET e um provedor de IA alcançável, e então devolver o
  redirecionamento.
-->
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    align-items: center; background: #f4f1ec; color: #161146;
    display: flex; justify-content: center; margin: 0; min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px;
  }
  main { max-width: 470px; }
  .marca { color: #6d35fb; font-size: 12px; font-weight: 800; letter-spacing: .12em; margin-bottom: 16px; text-align: center; }
  .aviso { background: #fffaf0; border: 1px solid #e6dcc8; border-left: 4px solid #d8a54a; border-radius: 14px; padding: 22px 24px; }
  .aviso strong { display: block; font-size: 17px; margin-bottom: 10px; }
  .aviso p { color: #6f6a85; font-size: 14.5px; line-height: 1.6; margin: 0; }
</style>
</head>
<body>
<main>
  <div class="marca">IA SCHOOLS</div>
  <div class="aviso">
    <strong>A demonstração ainda não está disponível por este endereço.</strong>
    <p>
      Ela roda hoje apenas na rede interna. Publicar aqui exige uma versão de
      produção da aplicação — o ambiente de desenvolvimento não funciona por este
      caminho: a página carrega, mas os botões não respondem.
    </p>
  </div>
</main>
</body>
</html>
